[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notify-ai-client"
version = "1.0.0"
description = "Notify.ai client SDK for Python: event capture and metadata transmission to acp-server"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "Rohan Naik" }]
dependencies = []

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.3"]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "confluent-kafka>=2.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
notify_ai = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
